<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Horde — prototype de survie</title>
<style>
  :root{color-scheme:dark;--panel:#19232ecc;--line:#2b3a49;--muted:#9eafbd;--cyan:#56c7ff}
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d151c;font:15px system-ui,Segoe UI,sans-serif;color:#eef5fa}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:2}
  .stats{display:flex;gap:6px;flex-wrap:wrap}
  .stat{background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);padding:6px 10px;border-radius:10px;min-width:68px}
  .stat b{display:block;font-size:16px}
  .stat small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
  .hp-bar{display:flex;gap:4px;margin-top:5px}
  .hp-bar i{display:block;height:6px;width:12px;border-radius:3px;background:#2b3a49;transition:background .15s}
  .hp-bar i.on{background:#ff626b;box-shadow:0 0 6px #ff626b88}
  .wave{background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);padding:6px 10px;border-radius:10px;font-size:11px;font-weight:600;color:var(--cyan);letter-spacing:.06em;white-space:nowrap}
  .overlay{position:fixed;inset:0;display:none;place-items:center;background:#05090dd9;text-align:center;padding:24px;z-index:10}
  .overlay.show{display:grid}
  .modal{max-width:340px}
  .modal h2{font-size:32px;margin:0 0 8px}
  .modal p{color:#c0ccd5;line-height:1.5;margin:0 0 20px}
  button.reset{background:var(--cyan);border:none;color:#08121a;font-weight:700;font-size:15px;padding:12px 24px;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
<div class="hud">
 <div class="stats">
  <div class="stat"><small>Vie</small><div class="hp-bar" id="hpBar"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="stat"><small>Temps</small><b id="time">00:00</b></div>
  <div class="stat"><small>Ennemis</small><b id="enemies">0</b></div>
  <div class="stat"><small>Éliminés</small><b id="kills">0</b></div>
  <div class="stat"><small>Filet</small><b id="netLen">340</b></div>
 </div>
 <div class="wave" id="waveLabel">VAGUE 1</div>
</div>
<canvas id="game"></canvas>
<div class="overlay" id="overlay"><div class="modal"><h2 id="endTitle">Attrapé !</h2><p id="endText"></p><button class="reset" onclick="restart()">Rejouer</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
let W=window.innerWidth,H=window.innerHeight;
const DEAD_MOUSE=18,DEAD_TOUCH=12,LOOP_MIN=90,LOOP_SNAP=14;
const START_NET_LEN=340,MAX_NET_CAP=3200;
let drag=null,catches=[],sid=0,strokeLen=0,maxNetLen=START_NET_LEN,netLastPt=null,wave=0,msg='',msgT=0;
let player,enemies,nets,orbs,orbSpawnTimer,elapsed,last,spawnTimer,dead,killsCount=0,lastSec=-1,lastCount=-1,lastWave=-1,lastHp=-1,lastKills=-1,lastNet=-1;
const $=id=>document.getElementById(id);

function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth;
 H=window.innerHeight;
 canvas.width=Math.floor(W*dpr);
 canvas.height=Math.floor(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
resize();

function restart(){
 player={x:0,y:0,px:0,py:0,r:8,speed:190,hp:5,inv:0};
 enemies=[];nets=[];catches=[];orbs=[];orbSpawnTimer=0;
 elapsed=0;last=0;spawnTimer=10.5;wave=0;msg='';msgT=0;killsCount=0;
 sid=0;strokeLen=0;maxNetLen=START_NET_LEN;netLastPt=null;dead=false;drag=null;
 lastSec=-1;lastCount=-1;lastWave=-1;lastHp=-1;lastKills=-1;lastNet=-1;
 $('overlay').classList.remove('show');
 updateUI(true);
 requestAnimationFrame(loop);
}

function spawnOrb(){
 const a=Math.random()*Math.PI*2;
 const dist=180+Math.random()*260;
 orbs.push({x:player.x+Math.cos(a)*dist,y:player.y+Math.sin(a)*dist,r:9,pulse:Math.random()*Math.PI*2});
}

function updateUI(force){
 if(force||player.hp!==lastHp){
  lastHp=player.hp;
  const pips=$('hpBar').children;
  for(let i=0;i<pips.length;i++)pips[i].classList.toggle('on',i<lastHp);
 }
 const sec=Math.floor(elapsed);
 if(force||sec!==lastSec){
  lastSec=sec;
  $('time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
 }
 if(force||enemies.length!==lastCount){
  lastCount=enemies.length;
  $('enemies').textContent=lastCount;
 }
 if(force||killsCount!==lastKills){
  lastKills=killsCount;
  $('kills').textContent=lastKills;
 }
 const nl=Math.round(maxNetLen);
 if(force||nl!==lastNet){
  lastNet=nl;
  $('netLen').textContent=lastNet;
 }
 const w=Math.max(1,wave);
 if(force||w!==lastWave){
  lastWave=w;
  $('waveLabel').textContent='VAGUE '+w;
 }
}

const TIERS=[null,{r:6,speed:88,color:'#ff7777'},{r:10,speed:57,color:'#e24b55'},{r:15,speed:34,color:'#a92e42'}];

function spawn(a,R,speedScale=1,maxTier=3){
 const x=player.x+Math.cos(a)*R,y=player.y+Math.sin(a)*R;
 const roll=Math.random();
 let hp=roll<.65?1:roll<.91?2:3;
 if(hp>maxTier)hp=maxTier;
 const t=TIERS[hp];
 enemies.push({x,y,r:t.r,hp,hitT:0,speed:t.speed*speedScale,side:Math.random()<.5?1:-1,lock:0,dead:false});
}

const GAP=105,MAX_ENEMIES=110;
const WAVE_START=12.5,WAVE_MIN=3.2,WAVE_HALF=300;
function spawnWave(){
 if(enemies.length>=MAX_ENEMIES)return;
 wave++;
 const R0=Math.hypot(W,H)/2+55,maxN=Math.floor(2*Math.PI*R0/GAP);
 // Premières vagues plus douces pour laisser le temps de faire grandir le filet
 let n;
 if(wave===1)n=6;
 else if(wave===2)n=8;
 else if(wave===3)n=11;
 else n=Math.min(maxN,10+Math.floor(elapsed/28)*2);

 const speedScale=wave<=3?(0.68+wave*0.09):1;
 const maxTier=wave<=2?1:(wave<=4?2:3);
 const rings=Math.min(2,1+Math.floor(elapsed/240));
 const a0=Math.random()*Math.PI*2;
 for(let k=0;k<rings;k++){
  if(enemies.length>=MAX_ENEMIES)break;
  const R=R0+k*85,step=Math.PI*2/n,off=a0+k*step/2;
  for(let i=0;i<n;i++){
   if(enemies.length>=MAX_ENEMIES)break;
   spawn(off+i*step+(Math.random()-.5)*step*.3,R+(Math.random()-.5)*16,speedScale,maxTier);
  }
 }
}

const SD={d:0,cx:0,cy:0};
function segDist(px,py,s){
 const dx=s.x2-s.x1,dy=s.y2-s.y1,l2=dx*dx+dy*dy||1;
 let t=((px-s.x1)*dx+(py-s.y1)*dy)/l2;t=Math.max(0,Math.min(1,t));
 SD.cx=s.x1+dx*t;SD.cy=s.y1+dy*t;SD.d=Math.hypot(px-SD.cx,py-SD.cy);return SD;
}

function inPoly(x,y,pts){
 let c=false;
 for(let i=0,j=pts.length-1;i<pts.length;j=i++){
  const a=pts[i],b=pts[j];
  if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c;
 }
 return c;
}

function checkLoop(){
 for(let i=0;i<nets.length-1;i++){
  const n=nets[i];
  if(n.sid!==sid||strokeLen-n.cl<LOOP_MIN)continue;
  const q=segDist(player.x,player.y,n);
  if(q.d<LOOP_SNAP){closeLoop(i,q.cx,q.cy);return}
 }
}

function closeLoop(i,cx,cy){
 const pts=[{x:cx,y:cy}];
 for(let k=i;k<nets.length;k++)if(nets[k].sid===sid)pts.push({x:nets[k].x2,y:nets[k].y2});
 let kills=0,shrinks=0;
 for(const e of enemies){
  if(!e.dead&&inPoly(e.x,e.y,pts)){
   e.hp--;
   e.hitT=.25;
   if(e.hp<=0){
    e.dead=true;
    kills++;
   }else{
    const t=TIERS[e.hp];
    e.r=t.r;
    e.speed=t.speed;
    shrinks++;
   }
  }
 }
 catches.push({pts,t:0});
 nets=[];
 sid++;strokeLen=0;netLastPt={x:player.x,y:player.y};

 // Le filet grandit au fur et à mesure des captures !
 const growth=kills*36+shrinks*18;
 if(growth>0){
  maxNetLen=Math.min(MAX_NET_CAP,maxNetLen+growth);
 }

 if(kills){
  killsCount+=kills;
  msg='+'+kills+' éliminé'+(kills>1?'s':'')+(shrinks?' ('+shrinks+' réduit'+(shrinks>1?'s':'')+')':'')+' · Filet +'+growth;
  msgT=1.5;
 }else if(shrinks){
  msg=shrinks+' ennemi'+(shrinks>1?'s':'')+' réduit'+(shrinks>1?'s':'')+' · Filet +'+growth;
  msgT=1.3;
 }
}

function layLine(){
 if(!netLastPt){netLastPt={x:player.px,y:player.py};sid++;strokeLen=0}
 const seg=Math.hypot(player.x-netLastPt.x,player.y-netLastPt.y);
 if(seg<6)return;
 strokeLen+=seg;
 nets.push({x1:netLastPt.x,y1:netLastPt.y,x2:player.x,y2:player.y,sid,cl:strokeLen});
 netLastPt={x:player.x,y:player.y};
 checkLoop();
 // Si le tracé dépasse la taille actuelle du filet, l'extrémité arrière avance avec toi
 while(nets.length>1&&strokeLen-nets[0].cl>maxNetLen){
  nets.shift();
 }
}

function movePlayer(dt){
 let dx=0,dy=0,on=false;
 if(drag){
  if(drag.mouse){dx=drag.x-W/2;dy=drag.y-H/2;on=Math.hypot(dx,dy)>DEAD_MOUSE}
  else if(drag.moved>DEAD_TOUCH){dx=drag.x-drag.sx;dy=drag.y-drag.sy;on=Math.hypot(dx,dy)>1}
 }
 if(on){
  const l=Math.hypot(dx,dy);dx/=l;dy/=l;
  player.px=player.x;player.py=player.y;
  player.x+=dx*player.speed*dt;
  player.y+=dy*player.speed*dt;
  layLine();
 }else{
  player.px=player.x;player.py=player.y;
 }
}

function updateEnemies(dt){
 for(let e of enemies){
  if(e.dead)continue;
  const dx=player.x-e.x,dy=player.y-e.y,l=Math.hypot(dx,dy)||1;
  let vx=dx/l,vy=dy/l;
  const speed=e.speed;
  let touch=false;
  for(let w of nets){
   const q=segDist(e.x,e.y,w),lim=e.r+3;
   if(q.d<lim+(e.lock?18:10)){
    touch=true;
    const nx=q.d>0?(e.x-q.cx)/q.d:1,ny=q.d>0?(e.y-q.cy)/q.d:0,dot=vx*nx+vy*ny;
    if(dot<0){
     const tx=-ny,ty=nx,tc=vx*tx+vy*ty;
     if(!e.lock)e.lock=Math.abs(tc)>.15?Math.sign(tc):e.side;
     vx=tx*e.lock-nx*.35;vy=ty*e.lock-ny*.35;
    }
   }
  }
  if(!touch)e.lock=0;
  const vl=Math.hypot(vx,vy)||1;vx/=vl;vy/=vl;
  e.x+=vx*speed*dt;e.y+=vy*speed*dt;
  for(let w of nets){
   const q=segDist(e.x,e.y,w),lim=e.r+3;
   if(q.d<lim){
    const nx=q.d>0?(e.x-q.cx)/q.d:1,ny=q.d>0?(e.y-q.cy)/q.d:0;
    e.x+=nx*(lim-q.d);e.y+=ny*(lim-q.d);
   }
  }
  if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
   if(player.inv<=0){
    player.hp--;
    player.inv=1.0;
    if(player.hp<=0){updateUI(true);finish(false);return}
   }
  }
 }
}

function update(dt){
 elapsed+=dt;
 msgT=Math.max(0,msgT-dt);
 if(player.inv>0)player.inv=Math.max(0,player.inv-dt);
 movePlayer(dt);
 spawnTimer+=dt;
 const interval=Math.max(WAVE_MIN,WAVE_START*Math.pow(.5,elapsed/WAVE_HALF));
 if(spawnTimer>interval){spawnTimer-=interval;spawnWave()}
 updateEnemies(dt);
 if(dead)return;
 for(const e of enemies)if(e.hitT>0)e.hitT=Math.max(0,e.hitT-dt);

 if(player.hp===1){
  orbSpawnTimer+=dt;
  if(orbSpawnTimer>2.5&&orbs.length<4){
   orbSpawnTimer=0;
   spawnOrb();
  }
 }else{
  orbSpawnTimer=0;
 }

 for(let o of orbs){
  o.pulse+=dt*5;
  if(!o.used&&Math.hypot(o.x-player.x,o.y-player.y)<o.r+player.r+4){
   o.used=true;
   if(player.hp<5){
    player.hp++;
    msg='Vie récupérée ! ('+player.hp+'/5)';
    msgT=1.2;
    if(player.hp>=5)orbs.forEach(other=>other.used=true);
   }
  }
 }
 orbs=orbs.filter(o=>!o.used&&Math.hypot(o.x-player.x,o.y-player.y)<1200);

 catches.forEach(c=>c.t+=dt);
 catches=catches.filter(c=>c.t<.5);
 enemies=enemies.filter(e=>!e.dead&&Math.hypot(e.x-player.x,e.y-player.y)<1100);
 if(elapsed>=3600)finish(true);
 updateUI(false);
}

function draw(){
 ctx.fillStyle='#0d151c';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(Math.round(W/2-player.x),Math.round(H/2-player.y));
 const G=44,x0=Math.floor((player.x-W/2)/G)*G,y0=Math.floor((player.y-H/2)/G)*G;
 ctx.lineWidth=1;ctx.strokeStyle='#182630';
 ctx.beginPath();
 for(let x=x0;x<=player.x+W/2+G;x+=G){ctx.moveTo(x,player.y-H/2-G);ctx.lineTo(x,player.y+H/2+G)}
 for(let y=y0;y<=player.y+H/2+G;y+=G){ctx.moveTo(player.x-W/2-G,y);ctx.lineTo(player.x+W/2+G,y)}
 ctx.stroke();

 ctx.lineCap='round';ctx.lineJoin='round';
 for(const c of catches){
  const a=1-c.t/.5;
  ctx.globalAlpha=a*.4;ctx.fillStyle='#56c7ff';
  ctx.beginPath();c.pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fill();
  ctx.globalAlpha=a;ctx.strokeStyle='#d5f4ff';ctx.lineWidth=3;ctx.stroke();
 }
 ctx.globalAlpha=1;

 if(nets.length>0){
  ctx.beginPath();
  for(let i=0;i<nets.length;i++){
   const t=nets[i];
   if(i===0||nets[i-1].sid!==t.sid)ctx.moveTo(t.x1,t.y1);
   ctx.lineTo(t.x2,t.y2);
  }
  ctx.strokeStyle='#56c7ff33';ctx.lineWidth=7;ctx.stroke();
  ctx.strokeStyle='#d5f4ff';ctx.lineWidth=2.5;ctx.stroke();

  // Point doré sur la queue du filet pour repérer où fermer la boucle
  if(nets.length>4){
   ctx.fillStyle='#ffd166';
   ctx.beginPath();ctx.arc(nets[0].x1,nets[0].y1,4.5,0,Math.PI*2);ctx.fill();
  }
 }

 for(const o of orbs){
  const s=1+Math.sin(o.pulse)*.18;
  ctx.fillStyle='#38ef7d33';ctx.beginPath();ctx.arc(o.x,o.y,o.r*1.9*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#38ef7d';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d8ffea';ctx.lineWidth=2;ctx.stroke();
 }

 if(player.inv<=0||Math.floor(player.inv*16)%2===0){
  ctx.fillStyle='#56c7ff28';ctx.beginPath();ctx.arc(player.x,player.y,17,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#56c7ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d5f4ff';ctx.lineWidth=2;ctx.stroke();
 }

 for(let e of enemies){
  ctx.fillStyle=e.hitT>0?'#ffffff':TIERS[e.hp].color;
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();

 for(const o of orbs){
  const sx=o.x-player.x+W/2,sy=o.y-player.y+H/2;
  if(sx<16||sx>W-16||sy<16||sy>H-16){
   const a=Math.atan2(sy-H/2,sx-W/2);
   const ix=Math.max(20,Math.min(W-20,W/2+Math.cos(a)*(W/2-24)));
   const iy=Math.max(64,Math.min(H-20,H/2+Math.sin(a)*(H/2-24)));
   ctx.fillStyle='#38ef7d';ctx.beginPath();ctx.arc(ix,iy,5,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#0d151c';ctx.lineWidth=1.5;ctx.stroke();
  }
 }

 if(msgT>0){
  ctx.fillStyle='#ffd166';ctx.font='bold 15px system-ui';ctx.textAlign='center';
  ctx.fillText(msg,W/2,86);ctx.textAlign='left';
 }
}

function finish(win){
 if(dead)return;
 dead=true;
 $('endTitle').textContent=win?'Échappé !':'Attrapé !';
 $('endText').textContent=win?'Tu as tenu une heure !':'Tu as survécu '+Math.floor(elapsed/60)+' min '+Math.floor(elapsed%60)+' s et éliminé '+killsCount+' ennemi'+(killsCount>1?'s':'')+'.';
 $('overlay').classList.add('show');
}

function loop(ts){
 if(dead)return;
 if(!last)last=ts;
 const dt=Math.min(.035,(ts-last)/1000);
 last=ts;
 update(dt);
 draw();
 if(!dead)requestAnimationFrame(loop);
}

function pos(e){return{x:e.clientX,y:e.clientY}}
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse')return;
 const p=pos(e);
 drag={mouse:false,sx:p.x,sy:p.y,x:p.x,y:p.y,moved:0,id:e.pointerId};
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 const p=pos(e);
 if(e.pointerType==='mouse'){drag={mouse:true,x:p.x,y:p.y,sx:p.x,sy:p.y,moved:99};return}
 if(drag&&!drag.mouse&&e.pointerId===drag.id){
  drag.x=p.x;drag.y=p.y;
  drag.moved=Math.max(drag.moved,Math.hypot(p.x-drag.sx,p.y-drag.sy));
 }
});
const endDrag=e=>{if(drag&&(drag.mouse?e.pointerType==='mouse':e.pointerId===drag.id))drag=null};
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('pointerleave',endDrag);
restart();
</script>
</body></html>
